<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8fafb">
<title>Energy Analysis — Clean Energy Experts</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f8fafb;color:#1a1a2e;min-height:100vh;-webkit-font-smoothing:antialiased}
/* Site nav — matches main site */
.site-nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.site-nav a.logo-link{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;color:#0f172a;text-decoration:none;white-space:nowrap}
.site-nav .logo-icon{height:28px;width:auto}
.site-nav .nav-links{display:flex;gap:20px;font-size:0.85rem;font-weight:500}
.site-nav .nav-links a{text-decoration:none;color:#475569}
.site-nav .nav-links a:hover,.site-nav .nav-links a.active{color:#2563eb}
.nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#0f172a;padding:4px}
@media(max-width:640px){
  .site-nav .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(255,255,255,0.98);flex-direction:column;padding:16px 24px;gap:12px;border-bottom:1px solid rgba(0,0,0,0.06);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
  .site-nav .nav-links.open{display:flex}
  .nav-toggle{display:block}
}
.app{max-width:600px;margin:0 auto;padding:80px 20px 20px}
.header{text-align:center;padding:24px 0 20px;border-bottom:1px solid #e2e8f0;margin-bottom:24px}
.header h1{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em}
.header h1 .energy{color:#1a1a2e}
.header h1 .analysis{color:#f59e0b}
.header p{font-size:0.82rem;color:#64748b;margin-top:4px}
.loading{text-align:center;padding:48px}
.loading .spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#64748b;font-size:0.9rem}
.error{text-align:center;padding:48px;color:#ef4444;font-weight:600}

/* Card styles — same as index.html */
.card{border-radius:12px;overflow:hidden;margin-bottom:12px;border:1px solid #e2e8f0;background:#fff}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:0.82rem;font-weight:700;background:#f8fafb;border-bottom:1px solid #e2e8f0}
.card-body{padding:16px}
.card-green{border-color:rgba(22,163,74,0.3)}
.card-green .card-head{background:rgba(22,163,74,0.04);border-bottom-color:rgba(22,163,74,0.15);color:#16a34a}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:0.82rem}
.row:last-child{border-bottom:none}
.row .k{color:#64748b}
.row .v{font-weight:600;color:#1a1a2e;text-align:right}
.math-box{background:#f1f5f9;border-radius:10px;padding:14px;margin:8px 0}
.math-row{display:flex;justify-content:space-between;font-size:0.82rem;padding:4px 0}
.math-row .k{color:#64748b}
.math-row .v{color:#1a1a2e;font-weight:500}
.math-divider{border-top:1px solid #e2e8f0;margin-top:6px;padding-top:6px}
.math-total .v{font-weight:700}
.division{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center;padding:12px;background:#f1f5f9;border-radius:10px;margin:8px 0}
.division .part{line-height:1.3}
.division .part .num{font-size:1.1rem;font-weight:700;color:#1a1a2e}
.division .part .lbl{font-size:0.6rem;color:#64748b}
.division .op{font-size:1.2rem;color:#94a3b8}
.division .result .num{color:#ef4444}
.progress-track{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:4px;transition:width 0.7s}
.progress-labels{display:flex;justify-content:space-between;font-size:0.65rem;color:#64748b;margin-top:3px}
.benefit-grid{display:grid;grid-template-columns:1fr;gap:8px}
.benefit-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.benefit-item:last-child{border-bottom:none}
.benefit-icon{width:28px;height:28px;border-radius:8px;background:rgba(22,163,74,0.08);display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0;margin-top:2px}
.benefit-title{font-size:0.82rem;font-weight:600;color:#1a1a2e}
.benefit-desc{font-size:0.72rem;color:#64748b;margin-top:1px;line-height:1.4}
.cust-bar{display:flex;gap:10px;flex-wrap:wrap;font-size:0.78rem;color:#64748b;padding:10px 14px;background:#f8fafb;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:12px}
.cust-bar .name{color:#1a1a2e;font-weight:600}
.cta{text-align:center;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin:12px 0}
.cta h3{font-size:1rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.cta p{font-size:0.82rem;color:#64748b;margin-bottom:10px}
.cta a{display:inline-block;background:#22c55e;color:#fff;padding:10px 24px;border-radius:8px;font-weight:700;font-size:0.9rem;text-decoration:none}
.timestamp{text-align:center;font-size:0.7rem;color:#94a3b8;margin-top:8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.toolbar .back-btn{display:inline-flex;align-items:center;gap:4px;font-size:0.82rem;color:#64748b;background:none;border:none;cursor:pointer;padding:4px 0;font-family:inherit}
.toolbar .back-btn:hover{color:#1a1a2e}
.toolbar .actions{display:flex;gap:8px}
.toolbar .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:0.75rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s}
.btn-blue{background:rgba(59,130,246,0.1);color:#60a5fa}
.btn-blue:hover{background:rgba(59,130,246,0.2)}
.btn-amber{background:rgba(245,158,11,0.1);color:#fbbf24}
.btn-amber:hover{background:rgba(245,158,11,0.2)}
.btn-green{background:rgba(34,197,94,0.1);color:#4ade80}
.btn-green:hover{background:rgba(34,197,94,0.2)}
.btn-copied{background:rgba(34,197,94,0.15)!important;color:#4ade80!important}
@media(max-width:480px){.division{gap:10px}.division .part .num{font-size:0.95rem}}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="/" class="logo-link"><img src="/images/logo.png" alt="CEE" class="logo-icon"> Clean Energy Experts</a>
  <div class="nav-links" id="navLinks">
    <a href="/">Home</a>
    <a href="/bill-scan/" class="active">Energy Analysis</a>
    <a href="/about.html">About</a>
    <a href="/contact.html">Contact</a>
  </div>
  <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
</nav>
<div class="app">
  <div class="header">
    <h1>⚡ <span class="energy">Energy</span> <span class="analysis">Analysis</span></h1>
    <p>Upload your power bill and see what the utility company really charges you</p>
  </div>
  <div id="toolbar" class="toolbar" style="display:none">
    <button class="back-btn" onclick="window.location.href='/'">‹ Back</button>
    <div class="actions">
      <button id="viewBillBtn" class="btn btn-blue" style="display:none" onclick="viewBill()">📄 View Bill</button>
      <button id="shareBtn" class="btn btn-amber" onclick="copyShareLink()">🔗 Share</button>
      <button class="btn btn-green" onclick="window.location.href='/bill-scan/'">⚡ New Analysis</button>
    </div>
  </div>
  <div id="loading" class="loading"><div class="spinner"></div><p>Loading analysis...</p></div>
  <div id="error" class="error" style="display:none"></div>
  <div id="results" style="display:none"></div>
</div>
<script>
const SB_URL='https://sxjtpprtaascxafddddg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4anRwcHJ0YWFzY3hhZmRkZGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDI1MjAsImV4cCI6MjA4NjY3ODUyMH0.sdIuHEAlahUjnZjRTB2E0haF0MkDF67NL34uKQWyERY';
const id=new URLSearchParams(location.search).get('id');

let _pdfUrl = null;

if(!id){show('error','No analysis ID provided.');}
else{loadAnalysis();}

function viewBill(){
  if(_pdfUrl) window.open(_pdfUrl, '_blank');
}

function copyShareLink(){
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('shareBtn');
    btn.innerHTML = '✅ Copied';
    btn.classList.add('btn-copied');
    setTimeout(() => { btn.innerHTML = '🔗 Share'; btn.classList.remove('btn-copied'); }, 2000);
  });
}

function show(el,msg){document.getElementById('loading').style.display='none';const e=document.getElementById(el);e.style.display='block';if(msg)e.textContent=msg;}

let _utilityCompany = 'Your utility';
const iconMap = { store: '🔋', protect: '🛡️', save: '📉', independence: '⚡' };

async function loadAnalysis(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/bill_analyses?id=eq.${id}&select=*`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    const rows=await r.json();
    if(!rows.length)throw new Error('Analysis not found');
    const row=rows[0];
    const d=row.raw_json;
    document.getElementById('loading').style.display='none';
    document.getElementById('results').style.display='block';
    document.getElementById('toolbar').style.display='flex';

    // Show View Bill button if PDF is stored
    if(row.pdf_url){
      _pdfUrl = row.pdf_url;
      document.getElementById('viewBillBtn').style.display='inline-flex';
    }

    // Support both new card format and legacy flat format
    if(d.cards && Array.isArray(d.cards)){
      renderCards(d.cards, row.created_at);
    } else {
      renderLegacy(d, row.created_at);
    }
  }catch(e){
    show('error', e.message||'Failed to load analysis');
  }
}

// ════════════════════════════════════════
// NEW CARD-BASED RENDERER
// ════════════════════════════════════════

function renderCards(cards, createdAt){
  const el=document.getElementById('results');
  const headerCard = cards.find(c => c.type === 'customer_header');
  _utilityCompany = headerCard?.utility_company || 'Your utility';

  let html = '';
  cards.forEach(card => {
    const fn = cardRenderers[card.type];
    if(fn) html += fn(card);
  });

  const date = createdAt ? new Date(createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  html += `<div class="cta"><h3>Ready to take control of your energy?</h3><p>See if your home qualifies for a battery program.</p><a href="/">Learn More →</a></div>`;
  if(date) html += `<div class="timestamp">Analysis from ${date}</div>`;
  el.innerHTML = html;
}

const cardRenderers = {
  customer_header(c) {
    return `<div class="cust-bar"><span class="name">👤 ${c.customer_name}</span><span>📍 ${c.service_address}</span>${c.utility_company ? `<span>🏢 ${c.utility_company}</span>` : ''}${c.rate_plan ? `<span>📋 ${c.rate_plan}</span>` : ''}<span>${c.has_solar ? '☀️ Solar' : '❌ No Solar'}</span></div>`;
  },

  real_rate(c) {
    const rate = String(c.effective_rate).replace(/^\$/, '');
    return `<div class="card"><div class="card-head" style="color:#f59e0b">⚡ Your Current Rate</div><div class="card-body">
      <div style="text-align:center;padding:4px 0 12px">
        <div style="font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#64748b;margin-bottom:4px">${_utilityCompany} is charging you</div>
        <div style="font-size:2.2rem;font-weight:900;color:#ef4444">$${rate}<small style="font-size:0.7rem;font-weight:500;color:#64748b">/kWh</small></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center">
        <div style="background:#f1f5f9;border-radius:8px;padding:10px"><div style="font-size:0.6rem;color:#64748b;font-weight:700;text-transform:uppercase">From Grid</div><div style="font-size:1.2rem;font-weight:700;color:#1a1a2e">${c.consumption_kwh}<small style="font-size:0.65rem;color:#64748b"> kWh</small></div></div>
        <div style="background:#f1f5f9;border-radius:8px;padding:10px"><div style="font-size:0.6rem;color:#64748b;font-weight:700;text-transform:uppercase">Grid Dependency</div><div style="font-size:1.2rem;font-weight:700;color:#f59e0b">${c.grid_dependency}%</div></div>
      </div>
    </div></div>`;
  },

  rate_explainer(c) {
    const rate = String(c.effective_rate).replace(/^\$/, '');
    let chargeHtml = '';
    if (c.charge_lines) {
      chargeHtml = `<div class="math-box">${c.charge_lines.map(l => `<div class="math-row"><span class="k">${l.label}</span><span class="v">${l.amount}</span></div>`).join('')}<div class="math-row math-divider math-total"><span class="k" style="color:#1a1a2e;font-weight:700">Total energy charges</span><span class="v" style="font-weight:700">${c.total_charges}</span></div></div>`;
    }
    return `<div class="card"><div class="card-head" style="color:#2563eb">❓ ${c.headline || 'Where Does Your Rate Come From?'}</div><div class="card-body">
      <p style="font-size:0.82rem;color:#64748b;line-height:1.6;margin-bottom:8px">${c.explainer_text}</p>
      ${chargeHtml}
      <div class="division">
        <div class="part"><div class="num">${c.total_charges}</div><div class="lbl">total charges</div></div>
        <div class="op">÷</div>
        <div class="part"><div class="num">${c.total_kwh} kWh</div><div class="lbl">electricity used</div></div>
        <div class="op">=</div>
        <div class="part result"><div class="num">$${rate}/kWh</div><div class="lbl">your real rate</div></div>
      </div>
      ${c.bottom_note ? `<p style="font-size:0.7rem;color:#94a3b8;line-height:1.5;margin-top:4px">${c.bottom_note}</p>` : ''}
    </div></div>`;
  },

  true_up(c) {
    const ytdClean = String(c.ytd_charges).replace(/^\$/, '').replace(/,/g, '');
    const ytd = parseFloat(ytdClean);
    const pct = Math.min((c.billing_month / 12) * 100, 100);
    const color = ytd > 1500 ? '#ef4444' : ytd > 800 ? '#f59e0b' : '#22c55e';
    return `<div class="card"><div class="card-head" style="color:#f59e0b">📊 True-Up Tracker</div><div class="card-body">
      <div style="text-align:center;padding:4px 0 8px">
        <div style="font-size:2rem;font-weight:900;color:${color}">$${ytdClean}</div>
        <div style="font-size:0.7rem;color:#64748b;margin-top:2px">year-to-date charges · month ${c.billing_month} of 12</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="progress-labels"><span>Billing start</span><span>${c.true_up_date || 'Settlement'}</span></div>
      ${c.credit_balance ? `<div class="row" style="margin-top:8px"><span class="k">Account credit</span><span class="v" style="color:#16a34a">$${String(c.credit_balance).replace(/^\$/,'').replace(/^-/,'')}</span></div>` : ''}
      ${c.explainer ? `<p style="font-size:0.72rem;color:#64748b;line-height:1.5;margin-top:8px">${c.explainer}</p>` : ''}
    </div></div>`;
  },

  energy_export(c) {
    return `<div class="card" style="border-color:rgba(234,179,8,0.3)"><div class="card-head" style="color:#ca8a04;background:rgba(234,179,8,0.05);border-bottom-color:rgba(234,179,8,0.15)">☀️ ${c.headline || 'Energy You\'re Losing'}</div><div class="card-body">
      <div style="text-align:center;padding:4px 0 8px">
        <div style="font-size:2rem;font-weight:900;color:#ca8a04">${c.exported_kwh}<small style="font-size:0.7rem;font-weight:500;color:#64748b"> kWh</small></div>
        <div style="font-size:0.7rem;color:#64748b;margin-top:2px">sent back to the grid this month</div>
      </div>
      <p style="font-size:0.82rem;color:#64748b;line-height:1.6;text-align:center">${c.explainer_text}</p>
    </div></div>`;
  },

  battery_benefits(c) {
    const benefitsHtml = (c.benefits || []).map(b => `
      <div class="benefit-item">
        <div class="benefit-icon">${iconMap[b.icon] || '⚡'}</div>
        <div><div class="benefit-title">${b.title}</div><div class="benefit-desc">${b.description}</div></div>
      </div>
    `).join('');
    return `<div class="card card-green"><div class="card-head">🔋 ${c.headline || 'What Batteries Change'}</div><div class="card-body"><div class="benefit-grid">${benefitsHtml}</div></div></div>`;
  },

  info(c) {
    return `<div class="card"><div class="card-head">${c.headline}</div><div class="card-body"><p style="font-size:0.82rem;color:#64748b;line-height:1.6">${c.body}</p></div></div>`;
  }
};

// ════════════════════════════════════════
// LEGACY FLAT FORMAT (old analyses)
// ════════════════════════════════════════

function renderLegacy(d, createdAt){
  const el=document.getElementById('results');
  const util = d.utility || 'Your utility';
  const rate = d.avg_import_rate ? d.avg_import_rate.toFixed(2) : '0.00';
  const ytd = d.ytd_charges ? d.ytd_charges.toFixed(2) : '0.00';
  const pct = Math.min(((d.billing_month||0)/12)*100,100);
  const date = createdAt ? new Date(createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';

  el.innerHTML=`
    <div class="cust-bar"><span class="name">👤 ${d.customer_name||'Customer'}</span><span>📍 ${d.service_address||''}</span><span>${d.has_solar?'☀️ Solar':'❌ No Solar'}</span></div>
    <div class="card"><div class="card-head" style="color:#f59e0b">⚡ Your Current Rate</div><div class="card-body">
      <div style="text-align:center;padding:4px 0 12px">
        <div style="font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#64748b;margin-bottom:4px">${util} is charging you</div>
        <div style="font-size:2.2rem;font-weight:900;color:#ef4444">$${rate}<small style="font-size:0.7rem;font-weight:500;color:#64748b">/kWh</small></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center">
        <div style="background:#f1f5f9;border-radius:8px;padding:10px"><div style="font-size:0.6rem;color:#64748b;font-weight:700;text-transform:uppercase">From Grid</div><div style="font-size:1.2rem;font-weight:700;color:#1a1a2e">${d.total_consumption_kwh||0}<small style="font-size:0.65rem;color:#64748b"> kWh</small></div></div>
        <div style="background:#f1f5f9;border-radius:8px;padding:10px"><div style="font-size:0.6rem;color:#64748b;font-weight:700;text-transform:uppercase">Grid Dependency</div><div style="font-size:1.2rem;font-weight:700;color:#f59e0b">${d.grid_dependency_pct||0}%</div></div>
      </div>
    </div></div>
    ${d.ytd_charges?`<div class="card"><div class="card-head" style="color:#f59e0b">📊 True-Up Tracker</div><div class="card-body">
      <div style="text-align:center;padding:4px 0 8px">
        <div style="font-size:2rem;font-weight:900;color:#f59e0b">$${ytd}</div>
        <div style="font-size:0.7rem;color:#64748b;margin-top:2px">year-to-date charges · month ${d.billing_month||'?'} of 12</div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:#f59e0b"></div></div>
      <div class="progress-labels"><span>Billing start</span><span>${d.true_up_date||'Settlement'}</span></div>
    </div></div>`:''}
    <div class="cta"><h3>Ready to take control of your energy?</h3><p>See if your home qualifies for a battery program.</p><a href="/">Learn More →</a></div>
    ${date?`<div class="timestamp">Analysis from ${date}</div>`:''}`;
}
</script>
</body>
</html>
